plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deskbuddy.v1'
    compileSdk 35

    defaultConfig {
        applicationId "com.deskbuddy.v1"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

// Some AndroidX dependencies pull Kotlin stdlib while the Android Gradle
// plugin can also bring older Kotlin JDK compatibility artifacts. Keep all
// Kotlin modules on one compatible version to avoid duplicate classes.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
}
